<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>OrderTag Generator</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f4f5;
  font-family: Arial, sans-serif;
  color: #111;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
  font-size: 30px;
}

textarea {
  width: 100%;
  min-height: 220px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  resize: vertical;
  font-size: 16px;
  outline: none;
}

textarea:focus {
  border-color: #111;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.result {
  display: none;
  margin-top: 22px;
}

.order-id {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  background: #f1f1f1;
  padding: 16px;
  border-radius: 12px;
}

pre {
  background: #18181b;
  color: white;
  padding: 16px;
  border-radius: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 15px;
}

.status {
  text-align: center;
  margin-top: 12px;
  font-size: 14px;
}

.success {
  color: green;
}

.error {
  color: red;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>OrderTag Generator</h1>

<textarea
  id="orderText"
  placeholder="Paste order here...

User_Name
Password
Backup: Optional
000 Robux"
></textarea>

<button
  id="generateBtn"
  onclick="generateOrder()"
>
Generate Order ID
</button>

<div
  id="status"
  class="status"
></div>


<div
  id="result"
  class="result"
>

<div
  id="orderId"
  class="order-id"
></div>

<pre
  id="formattedOrder"
></pre>

<button
  onclick="copyOrder()"
>
Copy Order
</button>

</div>

</div>

</div>


<script>

/*
========================================
PASTE YOUR GOOGLE APPS SCRIPT URL HERE
========================================
*/

const API_URL =
"https://script.google.com/macros/s/PASTE_YOUR_URL_HERE/exec";


let currentOrder = "";


/*
Generate Order
*/
function generateOrder() {

  const text =
    document
      .getElementById("orderText")
      .value
      .trim();

  const button =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");


  if (!text) {

    status.textContent =
      "Please paste the order first.";

    status.className =
      "status error";

    return;
  }


  button.disabled = true;

  status.textContent =
    "Generating Order ID...";

  status.className =
    "status";


  const callbackName =
    "orderCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      button.disabled = false;


      if (!data.success) {

        status.textContent =
          "Error: " + data.error;

        status.className =
          "status error";

        delete window[callbackName];

        return;
      }


      const orderId =
        data.orderId;


      currentOrder =
        "Order ID: " +
        orderId +
        "\n\n" +
        data.orderText;


      document
        .getElementById("orderId")
        .textContent = orderId;


      document
        .getElementById("formattedOrder")
        .textContent = currentOrder;


      document
        .getElementById("result")
        .style.display = "block";


      status.textContent =
        "Order ID generated successfully!";

      status.className =
        "status success";


      delete window[callbackName];

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=create" +
    "&text=" +
    encodeURIComponent(text) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      button.disabled = false;

      status.textContent =
        "Connection error. Please try again.";

      status.className =
        "status error";

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


/*
Copy complete order
*/
function copyOrder() {

  if (!currentOrder) {
    return;
  }


  navigator.clipboard
    .writeText(currentOrder)
    .then(function() {

      alert("Order copied!");

    })
    .catch(function() {

      alert("Copy failed.");

    });

}

</script>

</body>

</html>
