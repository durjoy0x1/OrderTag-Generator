<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OrderTag Generator</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f4f5;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 180px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

.result {
  display: none;
  margin-top: 20px;
}

.orderId {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  background: #18181b;
  color: white;
  padding: 15px;
  border-radius: 10px;
}

.status {
  text-align: center;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>OrderTag Generator</h1>

<textarea id="orderText"
placeholder="Paste order here...

User_Name
Passwore
Backup: Optional
0000 Robux"></textarea>

<button id="generateBtn" onclick="generateOrder()">
Generate Order ID
</button>

<div class="status" id="status"></div>

<div class="result" id="result">

<div class="orderId" id="orderId"></div>

<pre id="formattedOrder"></pre>

<button onclick="copyOrder()">
Copy Order
</button>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://tqpspaadbpspxdzdslvh.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcHNwYWFkYnBzcHhkemRzbHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTM4MTgsImV4cCI6MjEwNDA4OTgxOH0.s7gcC5mf7BHKy0UT1mQuwwzkhYVVz5fbDr2_xJ-ln6k";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentOrder = "";


async function generateOrder() {

  const textarea =
    document.getElementById("orderText");

  const button =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");

  const text =
    textarea.value.trim();


  if (!text) {

    alert("Please paste the order first!");

    return;

  }


  button.disabled = true;

  status.textContent =
    "Generating Order ID...";


  try {

    const { data, error } =
      await supabaseClient
      .from("orders")
      .insert({
        order_text: text
      })
      .select("id")
      .single();


    if (error) {

      console.error(error);

      throw error;

    }


    const serial =
      String(data.id).padStart(6, "0");

    const orderId =
      "#SC-" + serial;


    currentOrder =
      "Order ID: " +
      orderId +
      "\n\n" +
      text;


    document.getElementById("orderId")
      .textContent = orderId;


    document.getElementById("formattedOrder")
      .textContent = currentOrder;


    document.getElementById("result")
      .style.display = "block";


    status.textContent =
      "Order ID generated successfully!";


  } catch (error) {

    status.textContent =
      "Error: " + error.message;

  }


  button.disabled = false;

}


async function copyOrder() {

  try {

    await navigator.clipboard
      .writeText(currentOrder);

    alert("Order copied!");

  } catch {

    alert("Copy failed!");

  }

}

</script>

</body>
</html>
